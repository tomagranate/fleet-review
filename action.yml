name: Fleet review
description: PR review on the Linux fleet via jbot slim on OpenCode Go.

inputs:
  opencode-api-key:
    description: OpenCode Go API key
    required: true
  github-token:
    description: Token used to read the PR and post the review
    required: false
    default: ${{ github.token }}
  model:
    description: Model or comma-separated pool. Empty uses DeepSeek v4.1 Flash on OpenCode Go.
    required: false
    default: ""
  pr-number:
    description: Pull request number for workflow_dispatch
    required: false
    default: ""
  time-budget-minutes:
    description: Model time budget. jbot derives each session's timeout from it. Keep the caller job timeout above it.
    required: false
    # jbot gives each finder session this budget less about 5.5 minutes.
    # 16 gives each main review shard about 10 minutes.
    default: "16"

runs:
  using: composite
  steps:
    # jbot writes as root in Docker. Cancelled jobs also leave containers
    # that still hold _work. Drop both before this run opens GITHUB_OUTPUT.
    - name: Drop leftover jbot files
      shell: bash
      run: bash "${GITHUB_ACTION_PATH}/cleanup.sh"

    # One pass keeps the cost down. Auto shards split large diffs (up to
    # four shards) so each session finishes inside its timeout.
    - uses: pgup-ai/jbot-review-action/slim@5cb5a054087cfe171579ec208f8b3824671246a7 # v0
      with:
        model: ${{ inputs.model || 'opencode-go/deepseek-v4.1-flash' }}
        opencode-api-key: ${{ inputs.opencode-api-key }}
        github-token: ${{ inputs.github-token }}
        pr-number: ${{ github.event.pull_request.number || inputs.pr-number }}
        review-passes: "1"
        review-shards: "0"
        verify-findings: "true"
        skip-doc-only: "true"
        skip-unchanged: "true"
        auto-approve: "false"
        time-budget-minutes: ${{ inputs.time-budget-minutes }}
